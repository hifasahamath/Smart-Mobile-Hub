global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080' # API Gateway (and others if port is exposed)
          # Add other services as they get fixed ports, e.g., 'host.docker.internal:8081'
