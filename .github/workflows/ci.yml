name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - ai-service
          - analytics-service
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build ${{ matrix.service }}
      run: |
        cd backend/${{ matrix.service }}
        mvn clean verify -DskipTests=false
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.service }}
        path: backend/${{ matrix.service }}/target/surefire-reports/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    - name: Install Dependencies
      run: |
        cd frontend
        npm ci
    - name: Type Check & Build
      run: |
        cd frontend
        npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - ai-service
          - analytics-service
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Package ${{ matrix.service }}
      run: |
        cd backend/${{ matrix.service }}
        mvn clean package -DskipTests
    - name: Build Docker Image
      run: |
        docker build -t smh-${{ matrix.service }}:latest ./backend/${{ matrix.service }}
